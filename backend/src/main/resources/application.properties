spring.application.name=backend
spring.main.allow-bean-definition-overriding=true
server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.same-site=lax
spring.config.import=optional:file:./.env[.properties]

# Defaults match docker-compose.yml (postgres on host port 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# GitHub OAuth2 Client Registration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,repo

# OpenRouter AI Configuration (OpenAI-compatible API)
# Chat: free model via OpenRouter (defaults to openrouter/free router)
spring.ai.openai.api-key=${OPENROUTER_API_KEY:your-openrouter-api-key-here}
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.base-url=https://openrouter.ai/api
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.model=${OPENROUTER_CHAT_MODEL:google/gemma-4-31b-it:free}
spring.ai.openai.chat.options.max-tokens=4096
spring.ai.openai.chat.headers.HTTP-Referer=${FRONTEND_URL:http://localhost:3000}
spring.ai.openai.chat.headers.X-Title=DevPilot

# Embedding: OpenRouter 100% free embedding model (1024 dimensions)
spring.ai.openai.embedding.base-url=https://openrouter.ai/api
spring.ai.openai.embedding.embeddings-path=/v1/embeddings
spring.ai.openai.embedding.model=${OPENROUTER_EMBEDDING_MODEL:liquid/lfm-2.5-embedding-350m}
spring.ai.openai.embedding.headers.HTTP-Referer=${FRONTEND_URL:http://localhost:3000}
spring.ai.openai.embedding.headers.X-Title=DevPilot

# Vector Store PgVector
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=${VECTOR_DIMENSIONS:1024}

# App settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:devpilot-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50